<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60" role="img" aria-label="Launch app">
  <title>Launch app</title>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ece6a"/>
      <stop offset="1" stop-color="#73daca"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-90%" width="160%" height="280%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="clip"><rect x="16" y="14" width="188" height="32" rx="16"/></clipPath>
  </defs>

  <!-- breathing glow -->
  <rect x="16" y="14" width="188" height="32" rx="16" fill="url(#fill)" filter="url(#glow)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- button body -->
  <rect x="16" y="14" width="188" height="32" rx="16" fill="url(#fill)"/>
  <rect x="17" y="15" width="186" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.3"/>

  <!-- sheen sweep -->
  <g clip-path="url(#clip)">
    <rect x="-70" y="8" width="50" height="44" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-70;260" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pulsing live dot -->
  <circle cx="40" cy="30" r="3.5" fill="#0d1117" opacity="0.9"/>
  <circle cx="40" cy="30" r="3.5" fill="none" stroke="#0d1117" stroke-width="1.5">
    <animate attributeName="r" values="3.5;9" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- label -->
  <text x="56" y="34.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.3" fill="#0d1117">LAUNCH APP</text>
  <text x="176" y="35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0d1117">→
    <animateTransform attributeName="transform" type="translate" values="0 0;4 0;0 0" dur="1.8s" repeatCount="indefinite"/>
  </text>
</svg>
